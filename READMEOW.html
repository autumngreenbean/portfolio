<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READMEOW - Kitten's Catalog Archive</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: rgb(99, 200, 255);
      --rail: 150px;   /* left label column, shared by every band */
      --gap: 40px;
    }

    body {
      margin: 0;
      padding: 40px 80px 60px;
      background: #000;
      color: #e8e8e8;
      font-family: 'W95FA', monospace;
      font-size: 15px;
      line-height: 1.8;
      max-width: 1400px;
      margin: 0 auto;
      counter-reset: section;
    }

    h1 {
      font-size: 52px;
      font-weight: bold;
      margin: -10px 0 4px -5px;
      color: #f2f2f2;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .subtitle {
      color: #a8a8a8;
      font-size: 13px;
      margin: 0;
      font-weight: normal;
      letter-spacing: 0.01em;
    }

    h2 {
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 16px -5px;
      color: #f2f2f2;
      letter-spacing: -0.01em;
    }

    h3 {
      font-size: 13px;
      font-weight: bold;
      margin: 0 0 10px 0;
      color: var(--blue);
      /* text-transform: uppercase; */
      letter-spacing: 0.05em;
    }

    p {
      margin: 0 0 14px 0;
      color: #e8e8e8;
    }

    a {
      color: var(--blue);
      text-decoration: underline;
      transition: color 0.2s;
    }

    a:hover { color: #f2f2f2; }

    strong { color: #f2f2f2; font-weight: bold; }

    /* ---------- Running head (thin strip across the top) ---------- */
    .runhead {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f2f2f2;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #8a8a8a;
    }

    .runhead strong { letter-spacing: 0.12em; }

    /* ---------- Editorial band: narrow label rail + wide body ---------- */
    .band {
      display: grid;
      grid-template-columns: var(--rail) 1fr;
      column-gap: var(--gap);
      border-top: 1px solid #222;
      padding-top: 28px;
      margin-bottom: 56px;
      counter-increment: section;
    }

    .band.first {
      border-top: 0;
      padding-top: 56px;
      margin-bottom: 72px;
    }

    /* rail: big section number + vertical label, magazine side-bar style */
    .rail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: #8a8a8a;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .rail::before {
      content: counter(section, decimal-leading-zero);
      font-size: 52px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #f2f2f2;
    }

    .rail .vert {
      writing-mode: vertical-rl;
      margin-left: 6px;
    }

    .band.first .rail::before { content: none; }

    .body { min-width: 0; }

    /* ---------- Masthead ---------- */
    .masthead { display: grid; row-gap: 56px; }

    .lede {
      font-size: 14px;
      line-height: 1.7;
      max-width: 62ch;
      color: #f2f2f2;
    }

    /* about: heading in the narrow column, lede pushed right like a print standfirst */
    .about {
      display: grid;
      grid-template-columns: 1fr 2fr;
      column-gap: var(--gap);
      align-items: start;
      border-top: 1px solid #222;
      padding-top: 20px;
    }

    .about h2 { margin-bottom: 0; }

    /* ---------- Contents table ---------- */
    .cols {
      display: grid;
      gap: var(--gap);
      align-items: start;
    }

    .cols.contents { grid-template-columns: 5fr 7fr; }
    .cols.three { grid-template-columns: 1fr 1fr 1fr; }
    .cols.wide-right { grid-template-columns: 1fr 2fr; }

    .stack { display: flex; flex-direction: column; gap: 14px; }

    .checklist {
      font-size: 14px;
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: item;
      border-top: 1px solid #f2f2f2;
    }

    .checklist li {
      display: flex;
      gap: 16px;
      margin: 0;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      color: #f2f2f2;
      font-weight: bold;
      counter-increment: item;
    }

    .checklist li::before {
      content: counter(item, decimal-leading-zero);
      min-width: 2ch;
      color: #8a8a8a;
      font-weight: normal;
      font-size: 11px;
      line-height: 2.2;
      letter-spacing: 0.08em;
    }

    figure { margin: 0; }

    figure img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
    }

    /* caption sits in a narrow column beside the image */
    figure.sidecap {
      display: grid;
      grid-template-columns: 1fr 120px;
      column-gap: 18px;
      align-items: end;
    }

    figcaption {
      margin-top: 0;
      font-size: 11px;
      line-height: 1.6;
      color: #8a8a8a;
      font-style: italic;
      border-left: 1px solid #222;
      padding-left: 12px;
    }

    .aside { color: #a8a8a8; font-size: 13px; }

    .indent { display: block; padding-left: 15px; }

    .dots { display: flex; flex-direction: column; }
    .dots a { white-space: nowrap; }

    /* column heads get a hairline above, like a print column rule */
    .cols.three > .stack {
      border-top: 1px solid #222;
      padding-top: 14px;
    }

    /* ---------- Favorites run as a slash-separated line ---------- */
    .slashes { margin: 0; padding: 0; list-style: none; }
    .slashes li { display: inline; color: #e8e8e8; }
    .slashes li:not(:last-child)::after { content: ' / '; color: #8a8a8a; }

    /* ---------- Attributes as ruled rows ---------- */
    .footer { color: #a8a8a8; font-size: 13px; }

    .footer dl { margin: 0; border-top: 1px solid #f2f2f2; }

    .footer .row {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: var(--gap);
      padding: 8px 0;
      border-bottom: 1px solid #222;
    }

    .footer dt { color: #f2f2f2; font-weight: bold; }
    .footer dd { margin: 0; }

    @media (max-width: 1024px) {
      body { padding: 30px 50px 50px; }
      :root { --rail: 110px; --gap: 28px; }
      .rail::before { font-size: 40px; }
      .cols.contents, .cols.wide-right { grid-template-columns: 1fr; gap: 24px; }
      .cols.three { grid-template-columns: 1fr 1fr; }
      .about { grid-template-columns: 1fr; row-gap: 12px; }
    }

    @media (max-width: 768px) {
      body { padding: 24px 24px 40px; font-size: 14px; }
      h1 { font-size: 36px; }
      h2 { font-size: 18px; }
      .lede { font-size: 14px; }

      /* rail collapses into a single label line above each section */
      .band { grid-template-columns: 1fr; margin-bottom: 36px; padding-top: 16px; }
      .band.first { padding-top: 32px; margin-bottom: 44px; }
      .rail { flex-direction: row; align-items: baseline; gap: 12px; margin-bottom: 14px; }
      .rail::before { font-size: 24px; }
      .rail .vert { writing-mode: horizontal-tb; margin-left: 0; }

      .cols, .cols.three { grid-template-columns: 1fr; gap: 20px; }
      figure.sidecap { grid-template-columns: 1fr; row-gap: 10px; }
      figcaption { border-left: 0; padding-left: 0; }
      .footer .row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  // Escape HTML, then turn [text](url) into links (http(s) or relative paths only).
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const md = s => esc(s).replace(/\[([^\]]+)\]\(([^()\s]+(?:\([^)]*\)[^()\s]*)*)\)/g, (m, text, url) =>
    /^(https?:\/\/|\.?\/|[\w-]+\/)/.test(url) ? `<a href="${url}" target="_blank">${text}</a>` : m);

  const band = (label, inner, cls = '') => `
<div class="band ${cls}">
  <div class="rail"><span class="vert">${esc(label)}</span></div>
  <div class="body">${inner}</div>
</div>`;

  function render(d) {
    const t = d.todo || {}, c = d.collection || {}, img = c.image;
    const links = (arr, cls) => (arr || []).map(x => `<span class="${cls}">${md(x)}</span>`).join('');

    return `
<div class="runhead">
  <span><strong>READMEOW</strong></span>
  <span>Kitten's Catalog Archive</span>
</div>

${band('READMEOW', `
  <div class="masthead">
    <div>
      <h1>${esc(d.title)}</h1>
      <p class="subtitle">${md(d.intro)}<br>
        <i style="color:rgb(99, 200, 255)">${md(d.updated)}</i></p>
    </div>
    <div class="about">
      <h2>## about</h2>
      <p class="lede">${md(d.about)}</p>
    </div>
  </div>`, 'first')}

${band('!TODO', `
  <h2>## !TODO</h2>
  <div class="cols three">
    <div class="stack"><h3>...i will look at</h3><div class="dots">${(t.look || []).map(md).join('')}</div></div>
    <div class="stack"><h3>...i will add</h3><div>${links(t.add, 'indent')}</div></div>
    <div class="stack"><h3>...i will make</h3><div>${links(t.make, 'indent')}</div></div>
  </div>
  ${t.aside ? `<p class="aside" style="margin-top: 20px;">${md(t.aside)}</p>` : ''}`)}

${band('collection', `
  <div class="cols contents">
    <div>
      <h3>${esc(c.heading)}</h3>
      <ul class="checklist">${(c.items || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    </div>
    ${img ? `<figure class="sidecap">
      <img src="${esc(img.src)}" alt="${esc(img.alt)}">
      <figcaption>${esc(img.caption)}</figcaption>
    </figure>` : ''}
  </div>`)}

${band('playing', `
  <div class="cols wide-right">
    <div><h2>## currently playing</h2><p>${esc(d.playing)}</p></div>
    <div><h2>## favorites</h2><ul class="slashes">${(d.favorites || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  </div>`)}

${band('colophon', `
  <h2># Attributes</h2>
  <dl>${(d.attributes || []).map(a => `
    <div class="row"><dt>${esc(a.label)}</dt><dd>${md(a.value)}</dd></div>`).join('')}
  </dl>`, 'footer')}`;
  }

  fetch('READMEOW.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { document.getElementById('app').innerHTML = render(d); })
    .catch(e => { document.getElementById('app').textContent = 'could not load READMEOW.json (' + e.message + ')'; });
</script>

</body>
</html>
