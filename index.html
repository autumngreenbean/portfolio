<script>
  (function() {
    function detectMobileLayout() {
      const userAgentMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const screenWidth = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
      const viewportWidth = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth, screenWidth);
      return userAgentMobile || screenWidth <= 768 || viewportWidth <= 768;
    }

    function applyViewportScale() {
      const isMobile = detectMobileLayout();
      const viewport = document.querySelector('meta[name="viewport"]') || document.createElement('meta');
      viewport.name = 'viewport';
      viewport.content = isMobile ? 'width=device-width, initial-scale=0.5, viewport-fit=cover' : 'width=device-width, initial-scale=1';

      if (!document.querySelector('meta[name="viewport"]')) {
        document.head.appendChild(viewport);
      }
    }

    function applyFileboxScale() {
        const isMobile = detectMobileLayout();
        const filebox = document.querySelector('.filebox');
        if (isMobile && filebox) {
            filebox.style.right = '0px';
            filebox.style.bottom = '350';
            console.log('Applied mobile filebox scale');
        }
    }

    window.detectMobileLayout = detectMobileLayout;
    applyViewportScale();
    applyFileboxScale();

    window.addEventListener('resize', applyViewportScale);
  })();
</script>
