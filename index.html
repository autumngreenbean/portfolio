<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tim — Player Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px;
      color: #ccc; font-family: monospace; font-size: 13px;
      pointer-events: none; user-select: none;
      text-shadow: 0 1px 4px #000;
    }
    #loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #fff; font-family: monospace; font-size: 18px;
      background: #111; z-index: 10;
    }
    #devpanel {
      position: fixed; top: 12px; right: 12px;
      background: rgba(0,0,0,0.72); color: #ddd;
      font-family: monospace; font-size: 12px;
      padding: 10px 14px; border-radius: 8px;
      display: flex; flex-direction: column; gap: 6px;
      min-width: 220px; z-index: 5;
      border: 1px solid #333;
    }
    #devpanel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #devpanel input[type=range] { width: 110px; accent-color: #7af; }
    #devpanel span.val { width: 36px; text-align: right; color: #7af; }
    #devpanel summary { cursor: pointer; font-weight: bold; letter-spacing: .05em; margin-bottom: 2px; }

    /* ── Mobile controls ───────────────────────────────────────────────────── */
    #move-indicator {
      position: fixed;
      width: 130px; height: 130px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.05);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: none;
    }
    #move-dot {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.04s;
    }
    #cam-joystick-wrap {
      position: fixed;
      bottom: 28px; right: 28px;
      z-index: 20;
      display: none; /* shown only on touch devices via JS */
    }
    #cam-joystick-base {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.07);
      position: relative;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
    }
    #cam-joystick-knob {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      pointer-events: none;
      transition: transform 0.04s;
    }
    /* On true touch devices, hide keyboard hint and show joystick */
    @media (hover: none) and (pointer: coarse) {
      #info { display: none; }
      #cam-joystick-wrap { display: block; }
      #devpanel { font-size: 10px; min-width: 160px; padding: 7px 10px; }
      #devpanel input[type=range] { width: 80px; }
    }
  </style>
</head>
<body>

<div id="loading">Loading Tim…</div>
<div id="info">WASD / Arrow Keys — Move &nbsp;|&nbsp; Mouse Drag — Orbit Camera</div>

<!-- Mobile: full-screen movement indicator -->
<div id="move-indicator"><div id="move-dot"></div></div>

<!-- Mobile: camera-orbit joystick -->
<div id="cam-joystick-wrap">
  <div id="cam-joystick-base">
    <div id="cam-joystick-knob"></div>
  </div>
</div>

<details id="devpanel" open>
  <summary>⚙ Dev Controls</summary>
  <label>Ambient <input type="range" id="sl-ambient" min="0" max="2" step="0.05" value="0.4"><span class="val" id="vl-ambient">0.40</span></label>
  <label>Sun/Hemi <input type="range" id="sl-sun" min="0" max="3" step="0.05" value="0.7"><span class="val" id="vl-sun">0.70</span></label>
  <label>Exposure <input type="range" id="sl-expo" min="0.2" max="3" step="0.05" value="1.0"><span class="val" id="vl-expo">1.00</span></label>
  <label>Model Rot Y° <input type="range" id="sl-roty" min="-180" max="180" step="1" value="0"><span class="val" id="vl-roty">0</span></label>
  <label>Height <input type="range" id="sl-height" min="0.1" max="5" step="0.05" value="1.8"><span class="val" id="vl-height">1.80</span></label>
  <label>Walk Speed <input type="range" id="sl-speed" min="0.5" max="20" step="0.5" value="4"><span class="val" id="vl-speed">4.00</span></label>
  <label>Fallback Mat <input type="checkbox" id="ck-fallback"></label>
</details>

<script type="module">
import * as THREE from 'three';
import { FBXLoader }     from 'three/examples/jsm/loaders/FBXLoader.js';

// ══════════════════════════════════════════════════════════════════════════════
//  PARAMETERS — tweak these to fix the look without touching the logic below
// ══════════════════════════════════════════════════════════════════════════════
const P = {

  // ── Model ──────────────────────────────────────────────────────────────────
  modelPath:       'assets/Tim/Tim.fbx',

  // Set to 'auto' to auto-fit the model to targetHeight world-units tall.
  // Set to a number (e.g. 0.01) to use a fixed scale instead.
  modelScale:      'auto',
  targetHeight:    1.8,            // desired model height in world units (metres)

  // Rotate the model around Y if it faces the wrong direction.
  // 0 = faces +Z, Math.PI = faces -Z (flipped 180°), Math.PI/2 = faces +X, etc.
  modelRotationY:  0,

  // Additional X tilt (radians) — set to -Math.PI/2 if model spawns lying down.
  modelRotationX:  0,

  // Fine-tune vertical position after auto-grounding (positive = lift up).
  modelOffsetY:    0,

  // Show XYZ axes on the model for debugging. Red=X, Green=Y, Blue=Z.
  showAxes:        true,

  // ── Movement ───────────────────────────────────────────────────────────────
  walkSpeed:       4,           // world-units per second
  turnSpeed:       10,          // how fast Tim rotates to face movement direction
  animTimeScale:   1.0,         // walk animation playback speed multiplier

  // ── Camera ─────────────────────────────────────────────────────────────────
  cameraDistance:  6,           // orbit distance from player
  cameraHeight:    2.5,         // height of camera above player origin
  cameraTargetY:   1.2,         // how high on Tim the camera looks at
  minOrbitDist:    2,
  maxOrbitDist:    20,

  // ── Grid ───────────────────────────────────────────────────────────────────
  gridSize:        200,
  gridDivisions:   60,
  gridColorCenter: 0x555555,
  gridColorLines:  0x222222,

  // ── Lighting ───────────────────────────────────────────────────────────────
  ambientColor:    0xffffff,
  ambientIntensity:0.4,          // soft fill
  hemiSkyColor:    0xb0cce0,     // hemisphere sky colour
  hemiGroundColor: 0x443322,     // hemisphere ground bounce
  hemiIntensity:   0.6,          // hemisphere light strength
  dirLightColor:   0xfff4e0,
  dirLightIntensity:0.7,         // main sun — kept subtle
  dirLightPos:     [5, 10, 5],

  // ── Scene ──────────────────────────────────────────────────────────────────
  bgColor:         0x1a1e24,
  fogNear:         40,
  fogFar:          120,

};
// ══════════════════════════════════════════════════════════════════════════════

// ── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(P.bgColor);
scene.fog = new THREE.Fog(P.bgColor, P.fogNear, P.fogFar);

// ── Renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Camera ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 600);

// ── Manual follow-camera state ───────────────────────────────────────────────
// camYaw   = horizontal rotation around player (mouse left/right)
// camPitch = vertical angle above player     (mouse up/down)
let camYaw   = 0;     // start behind player (camera at +Z, player faces -Z)
let camPitch = 0.35;      // ~20° above horizon
const CAM_SENS = 0.004;   // mouse sensitivity

let _dragging = false, _lastX = 0, _lastY = 0;
renderer.domElement.addEventListener('mousedown', e => { _dragging = true; _lastX = e.clientX; _lastY = e.clientY; });
window.addEventListener('mouseup',   () => { _dragging = false; });
window.addEventListener('mousemove', e => {
  if (!_dragging) return;
  camYaw   -= (e.clientX - _lastX) * CAM_SENS;
  camPitch  = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, camPitch - (e.clientY - _lastY) * CAM_SENS));
  _lastX = e.clientX; _lastY = e.clientY;
});
// ── Mobile touch controls ───────────────────────────────────────────────────
const moveIndicator = document.getElementById('move-indicator');
const moveDotEl     = document.getElementById('move-dot');
const camJoyWrap    = document.getElementById('cam-joystick-wrap');
const camJoyBase    = document.getElementById('cam-joystick-base');
const camJoyKnob    = document.getElementById('cam-joystick-knob');

// Show joystick on any touch device
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  camJoyWrap.style.display = 'block';
}

const JOY_RADIUS  = 55;  // px — max knob travel from centre
const MOVE_MAX    = 65;  // px — drag distance for full speed
const MOVE_DEAD   = 8;   // px — dead zone

let moveTouchId = null, moveTouchOX = 0, moveTouchOY = 0;
let moveDX = 0, moveDY = 0;   // -1..1 normalised movement axes

let camTouchId = null;
let camJoyX = 0, camJoyY = 0; // -1..1 joystick axes (read each frame)

function joystickContains(x, y) {
  const r = camJoyBase.getBoundingClientRect();
  return Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)) < r.width / 2 + 16;
}

window.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (camTouchId === null && joystickContains(t.clientX, t.clientY)) {
      camTouchId = t.identifier;
    } else if (moveTouchId === null) {
      moveTouchId = t.identifier;
      moveTouchOX = t.clientX;
      moveTouchOY = t.clientY;
      moveDX = 0; moveDY = 0;
      moveIndicator.style.left = `${t.clientX}px`;
      moveIndicator.style.top  = `${t.clientY}px`;
      moveIndicator.style.display = 'block';
    }
  }
}, { passive: true });

window.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === moveTouchId) {
      const dx = t.clientX - moveTouchOX;
      const dy = t.clientY - moveTouchOY;
      const dist = Math.hypot(dx, dy);
      if (dist > MOVE_DEAD) {
        const scale = Math.min(dist, MOVE_MAX) / MOVE_MAX;
        moveDX = (dx / dist) * scale;
        moveDY = (dy / dist) * scale;
        const dotX = (dx / dist) * Math.min(dist, JOY_RADIUS);
        const dotY = (dy / dist) * Math.min(dist, JOY_RADIUS);
        moveDotEl.style.transform = `translate(calc(-50% + ${dotX}px), calc(-50% + ${dotY}px))`;
      } else {
        moveDX = 0; moveDY = 0;
        moveDotEl.style.transform = 'translate(-50%, -50%)';
      }
    } else if (t.identifier === camTouchId) {
      const r   = camJoyBase.getBoundingClientRect();
      const cx  = r.left + r.width  / 2;
      const cy  = r.top  + r.height / 2;
      const dx  = t.clientX - cx;
      const dy  = t.clientY - cy;
      const dist = Math.hypot(dx, dy);
      const capped = Math.min(dist, JOY_RADIUS);
      camJoyX = dist > 1 ? (dx / dist) * (capped / JOY_RADIUS) : 0;
      camJoyY = dist > 1 ? (dy / dist) * (capped / JOY_RADIUS) : 0;
      camJoyKnob.style.transform = `translate(${camJoyX * JOY_RADIUS}px, ${camJoyY * JOY_RADIUS}px)`;
    }
  }
}, { passive: true });

window.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === moveTouchId) {
      moveTouchId = null;
      moveDX = 0; moveDY = 0;
      moveIndicator.style.display = 'none';
      moveDotEl.style.transform = 'translate(-50%, -50%)';
    } else if (t.identifier === camTouchId) {
      camTouchId = null;
      camJoyX = 0; camJoyY = 0;
      camJoyKnob.style.transform = '';
    }
  }
}, { passive: true });
// Scroll to zoom
window.addEventListener('wheel', e => {
  P.cameraDistance = Math.max(P.minOrbitDist, Math.min(P.maxOrbitDist, P.cameraDistance + e.deltaY * 0.01));
}, { passive: true });

// ── Grid ─────────────────────────────────────────────────────────────────────
const grid = new THREE.GridHelper(P.gridSize, P.gridDivisions, P.gridColorCenter, P.gridColorLines);
scene.add(grid);

// Invisible ground plane so shadows land somewhere
const groundGeo  = new THREE.PlaneGeometry(P.gridSize, P.gridSize);
const groundMat  = new THREE.ShadowMaterial({ opacity: 0.3 });
const ground     = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x  = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Lights ───────────────────────────────────────────────────────────────────
// Flat fill
const ambient = new THREE.AmbientLight(P.ambientColor, P.ambientIntensity);
scene.add(ambient);

// Sky/ground hemisphere — key source of soft, natural lighting
const hemiLight = new THREE.HemisphereLight(P.hemiSkyColor, P.hemiGroundColor, P.hemiIntensity);
scene.add(hemiLight);

// Directional sun — shadows only, kept subtle
const dirLight = new THREE.DirectionalLight(P.dirLightColor, P.dirLightIntensity);
dirLight.position.set(...P.dirLightPos);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far  = 80;
dirLight.shadow.camera.left = dirLight.shadow.camera.bottom = -20;
dirLight.shadow.camera.right = dirLight.shadow.camera.top   =  20;
scene.add(dirLight);

// ── Input ────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true;  e.preventDefault(); }, { passive: false });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

// ── Player state ─────────────────────────────────────────────────────────────
let mixer      = null;
let walkAction = null;
let playerRoot = null;
const playerPos  = new THREE.Vector3();
let   facingYaw  = 0;   // current model facing angle (radians)

// ── Load FBX ─────────────────────────────────────────────────────────────────
const loader = new FBXLoader();
// Tell loader where to find textures (same folder as the FBX)
// Textures live in the .fbm companion folder next to the FBX
const fbxBase = P.modelPath.substring(0, P.modelPath.lastIndexOf('/') + 1);
const fbxStem = P.modelPath.substring(P.modelPath.lastIndexOf('/') + 1).replace(/\.fbx$/i, '');
loader.setResourcePath( fbxBase + fbxStem + '.fbm/' );
loader.load(
  P.modelPath,
  fbx => {
    fbx.rotation.set(P.modelRotationX, P.modelRotationY, 0);

    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, side: THREE.DoubleSide });

    fbx.traverse(child => {
      if (child.isMesh) {
        child.castShadow    = true;
        child.receiveShadow = true;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        const fixed = mats.map(m => {
          if (!m) return fallbackMat;
          // Detect effectively invisible material (black + no map)
          const col = m.color;
          const isBlack = col && col.r < 0.01 && col.g < 0.01 && col.b < 0.01 && !m.map;
          if (isBlack) return fallbackMat;
          m.side = THREE.DoubleSide;
          m.depthWrite = true;
          m.transparent = false;
          return m;
        });
        child.material = Array.isArray(child.material) ? fixed : fixed[0];
        child._origMats = mats; // stored for fallback toggle
        child._fallbackMat = fallbackMat;
      }
    });

    // ── Auto-fit: measure raw bounding box, then scale so the model is
    //    P.targetHeight world-units tall and sits on y=0.
    //    Override by setting P.modelScale > 0 to skip auto-fit.
    if (P.modelScale === 'auto') {
      const box = new THREE.Box3().setFromObject(fbx);
      const rawHeight = box.max.y - box.min.y;
      const scale = rawHeight > 0 ? P.targetHeight / rawHeight : 1;
      fbx.scale.setScalar(scale);
    } else {
      fbx.scale.setScalar(P.modelScale);
    }

    // ── Center pivot: shift fbx so its bounding-box centre is at (0,0,0)
    //    of the playerRoot, then ground it to y=0.
    //    This ensures rotation spins in place with no drift.
    {
      const box = new THREE.Box3().setFromObject(fbx);
      const center = new THREE.Vector3();
      box.getCenter(center);
      fbx.position.x -= center.x;
      fbx.position.z -= center.z;
      fbx.position.y -= box.min.y - P.modelOffsetY; // ground feet
    }

    // Axes helper — shows X (red) Y (green) Z (blue) at model origin.
    // Set P.showAxes = false to hide.
    if (P.showAxes) fbx.add(new THREE.AxesHelper(P.targetHeight * 0.5));

// Remember resting local transform so we can cancel out any baked
// root-motion translation from the animation clip every frame —
// playerRoot alone should drive world position, not the clip itself.
fbx.userData.restX = fbx.position.x;
fbx.userData.restZ = fbx.position.z;

    // Outer group handles world position & directional rotation
    playerRoot = new THREE.Group();
    playerRoot.add(fbx);
    scene.add(playerRoot);

    // Set up animation mixer
    mixer = new THREE.AnimationMixer(fbx);
    console.log(`[Tim] Loaded. Animations found: ${fbx.animations.length}`);
    if (fbx.animations.length > 0) {
      walkAction = mixer.clipAction(fbx.animations[0]);
      walkAction.timeScale = P.animTimeScale;
      walkAction.play();
      walkAction.paused = true;   // start paused; unpaused when moving
    }

    document.getElementById('loading').style.display = 'none';
  },
  xhr  => { document.getElementById('loading').textContent = `Loading Tim… ${Math.round(xhr.loaded / xhr.total * 100)}%`; },
  err  => {
    document.getElementById('loading').textContent = 'Failed to load Tim.fbx';
    console.error(err);
  }
);

// ── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Scratch vectors ──────────────────────────────────────────────────────────
const _fwd  = new THREE.Vector3();
const _rgt  = new THREE.Vector3();
const _move = new THREE.Vector3();
const _up   = new THREE.Vector3(0, 1, 0);
const clock = {
  _prev: performance.now() / 1000,
  getDelta() {
    const now = performance.now() / 1000;
    const d = now - this._prev;
    this._prev = now;
    return Math.min(d, 1 / 20); // clamp to max ~50ms per frame
  }
};

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) clock._prev = performance.now() / 1000;
});

// ── Main loop ────────────────────────────────────────────────────────────────
function updateCamera() {
  // Camera orbits around playerPos at (camYaw, camPitch, cameraDistance)
  const lookAtY = playerPos.y + P.cameraTargetY;
  const cosP = Math.cos(camPitch);
  camera.position.set(
    playerPos.x + Math.sin(camYaw) * cosP * P.cameraDistance,
    lookAtY     + Math.sin(camPitch)      * P.cameraDistance,
    playerPos.z + Math.cos(camYaw) * cosP * P.cameraDistance
  );
  camera.lookAt(playerPos.x, lookAtY, playerPos.z);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (playerRoot) {
    // Movement axes from camYaw — negated so W = away from camera
    _fwd.set(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    _rgt.set( Math.cos(camYaw), 0, -Math.sin(camYaw));

    _move.set(0, 0, 0);
    if (keys['KeyW'] || keys['ArrowUp'])    _move.addScaledVector(_fwd,  1);
    if (keys['KeyS'] || keys['ArrowDown'])  _move.addScaledVector(_fwd, -1);
    if (keys['KeyA'] || keys['ArrowLeft'])  _move.addScaledVector(_rgt, -1);
    if (keys['KeyD'] || keys['ArrowRight']) _move.addScaledVector(_rgt,  1);
    // Mobile touch movement: drag up = forward, drag right = strafe right
    if (moveDX !== 0 || moveDY !== 0) {
      _move.addScaledVector(_fwd, -moveDY);
      _move.addScaledVector(_rgt,  moveDX);
    }

    const moving = _move.lengthSq() > 0.001;

    if (moving) {
      _move.normalize();
      playerPos.addScaledVector(_move, P.walkSpeed * dt);
      playerRoot.position.copy(playerPos);

      // Smoothly rotate model to face movement direction.
      // Subtract modelRotationY so the facing is independent of the model's
      // built-in correction offset inside playerRoot.
      const targetYaw = Math.atan2(_move.x, _move.z) - P.modelRotationY;
      let diff = targetYaw - facingYaw;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      facingYaw += diff * Math.min(1, P.turnSpeed * dt);
      playerRoot.rotation.y = facingYaw;
    }

    

    if (walkAction) walkAction.paused = !moving;
if (mixer)      mixer.update(dt);

// Neutralize any baked root-motion translation from the clip so only
// playerRoot.position (driven by our own movement code) moves the character.
if (playerRoot) {
  const fbx = playerRoot.children[0];
  if (fbx.userData.restX !== undefined) {
    fbx.position.x = fbx.userData.restX;
    fbx.position.z = fbx.userData.restZ;
  }
}
  }

  // Mobile camera joystick — rotate orbit each frame
  if (camJoyX !== 0 || camJoyY !== 0) {
    const CAM_JOY_SPD = 2.2;
    camYaw   -= camJoyX * CAM_JOY_SPD * dt;
    camPitch  = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, camPitch - camJoyY * CAM_JOY_SPD * dt));
  }

  updateCamera();
  renderer.render(scene, camera);
}

animate();

// ── Dev panel wiring ─────────────────────────────────────────────────────────
function slider(id, valId, onChange) {
  const el = document.getElementById(id);
  const vl = document.getElementById(valId);
  el.addEventListener('input', () => { vl.textContent = parseFloat(el.value).toFixed(2); onChange(parseFloat(el.value)); });
}
slider('sl-ambient', 'vl-ambient', v => { ambient.intensity = v; });
slider('sl-sun',     'vl-sun',     v => { dirLight.intensity = v; hemiLight.intensity = v * 0.85; });
slider('sl-expo',    'vl-expo',    v => { renderer.toneMappingExposure = v; });
slider('sl-height',  'vl-height',  v => {
  P.targetHeight = v;
  if (playerRoot) {
    const fbx = playerRoot.children[0];
    const box = new THREE.Box3().setFromObject(fbx);
    const rawH = (box.max.y - box.min.y) / fbx.scale.x;
    const s = rawH > 0 ? v / rawH : fbx.scale.x;
    fbx.scale.setScalar(s);
    const b2 = new THREE.Box3().setFromObject(fbx);
    const center = new THREE.Vector3(); b2.getCenter(center);
    fbx.position.x -= center.x;
    fbx.position.z -= center.z;
    fbx.position.y -= b2.min.y - P.modelOffsetY;
  }
});
slider('sl-speed', 'vl-speed', v => { P.walkSpeed = v; });

const slRoty = document.getElementById('sl-roty');
const vlRoty = document.getElementById('vl-roty');
slRoty.addEventListener('input', () => {
  const deg = parseFloat(slRoty.value);
  vlRoty.textContent = deg;
  P.modelRotationY = deg * Math.PI / 180;
  if (playerRoot) playerRoot.children[0].rotation.y = P.modelRotationY;
});

document.getElementById('ck-fallback').addEventListener('change', e => {
  if (!playerRoot) return;
  playerRoot.children[0].traverse(child => {
    if (!child.isMesh || !child._origMats) return;
    child.material = e.target.checked
      ? (Array.isArray(child.material) ? child._origMats.map(() => child._fallbackMat) : child._fallbackMat)
      : (Array.isArray(child._origMats) ? child._origMats : child._origMats[0]);
  });
});
</script>
