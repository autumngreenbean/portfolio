<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>READMEOW.md</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/w95fa">
  <style>
    :root {
      --bg: #000;
      --panel: #0b0b0b;
      --line: #222;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --accent: #f2f2f2;
      --hover: #161616;
      --active: #1f1f1f;
      --sidebar-w: 280px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'W95FA', monospace;
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100%;
    }

    /* ---------- Side panel ---------- */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar h1 {
      margin: 0;
      padding: 20px 20px 14px;
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 0.04em;
/*       text-transform: uppercase; */
      color: var(--accent);
    }

    /* Mobile-only buttons (shown in the media query below) */
    .top-actions {
      display: none;
      gap: 6px;
      padding-right: 12px;
    }

    .top-btn {
      all: unset;
      box-sizing: border-box;
      cursor: pointer;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 0px;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
    }

    .top-btn:hover { background: var(--hover); }
    .top-btn:focus-visible { outline: 1px solid var(--muted); }
    .top-btn[aria-expanded="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .sidebar .count {
      padding: 12px 20px 14px;
      color: var(--muted);
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }

    .search { padding: 0 12px 12px; }

    .search input {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 0px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 16px; /* 16px stops iPhones zooming in when the box is focused */
    }

    .search input::placeholder { color: var(--muted); }
    .search input:focus { border-color: var(--muted); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 12px;
    }

    .filters button {
      all: unset;
      box-sizing: border-box;
      cursor: pointer;
      padding: 2px 10px;
      border: 1px solid var(--line);
      border-radius: 0px;
      font-size: 14px;
      color: var(--muted);
    }

    .filters button:hover { color: var(--text); background: var(--hover); }
    .filters button:focus-visible { outline: 1px solid var(--muted); }
    .filters button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .list .empty { color: var(--muted); padding: 10px 12px; }

    .list {
      list-style: none;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .list button {
      all: unset;
      box-sizing: border-box;
      display: block;
      width: 100%;
      padding: 10px 12px;
      border-radius: 2px;
      cursor: pointer;
      color: var(--text);
    }

    .list button:hover { background: var(--hover); }
    .list button:focus-visible { outline: 1px solid var(--muted); }
    .list button[aria-current="true"] { background: var(--active); color: var(--accent); }

    .list .name { display: block; }
    .list .sub { display: block; color: var(--muted); font-size: 14px; }

    /* ---------- Main ---------- */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 20px;
      gap: 16px;
    }

    .viewer {
      flex: 1;
      min-height: 320px;
      overflow: hidden;
      background: #111;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .note {
      padding: 14px 18px;
      background: var(--panel);
      max-height: 30vh;
      overflow-y: auto;
    }

    .note h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: normal;
      color: var(--accent);
    }

    .note p { margin: 0 0 8px; color: var(--text); }

    .note .webmaster {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .note a { color: var(--accent); }

    /* Loading indicator */
    #pdf-loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 14px;
      font-family: inherit;
    }

    @keyframes dots {
      0% { content: 'Loading.'; }
      33% { content: 'Loading..'; }
      66% { content: 'Loading...'; }
    }

    #pdf-loading::after {
      content: 'Loading.';
      animation: dots 1s steps(3, end) infinite;
    }

    /* ---------- Mobile ----------
       The page fills the real visible screen (dvh accounts for the
       phone's address bar). The viewer takes all the space left over,
       and the menu opens as an overlay so it never squeezes the viewer. */
  @media (max-width: 768px) {
  body { zoom: 0.43; }

 .app {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto minmax(0, 1fr) 29%;  /* title | viewer | bottom column */
  height: 100%;                                 /* was 93% */
}

  .sidebar, .main { display: contents; }

  .top { grid-column: 1 / 3; grid-row: 1; padding: 6px; }
  .sidebar h1 { padding: 15px 14px; font-size: 100%; }

  .viewer {
    grid-column: 1 / 3;
    grid-row: 2;
    min-height: 0;      /* overrides the desktop 320px */
    padding: 6px;
  }

  /* Bottom left: search + filters + list */
  .panel {
    grid-column: 1;
    grid-row: 3;
    min-height: 0;
    overflow: hidden;   /* the list scrolls, not the panel */
    border-top: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .search { padding: 0 8px 8px; }
  .search input { font-size: 100%; }
  .filters { flex-wrap: nowrap; overflow-x: auto; padding: 0 8px 8px; }
  .filters button { padding: 8px 14px; font-size: 100%; white-space: nowrap; }
  .sidebar .count { display: none; }
  .list { flex: 1; min-height: 0; padding: 6px 8px 12px; }
  .list button { padding: 14px; font-size: 100%; }

  /* Bottom right: description */
  .note {
    grid-column: 2;
    grid-row: 3;
    min-height: 0;
    max-height: none;   /* overrides the desktop 30vh */
    overflow-y: auto;
    padding: 14px;
    border-top: 1px solid var(--line);
  }
  .note h2 { font-size: 100%; margin: 0 0 6px; }
  .note p { font-size: 100%; margin: 0 0 10px; }
  .note .webmaster { font-size: 100%; margin-bottom: 10px; }
  .note a { font-size: 100%; }
}
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="top">
      <h1>Kitten's Catalog Archive</h1>
    </div>

    <div class="panel" id="panel">
      <div class="search">
        <input type="search" id="search" placeholder="Search descriptions…"
               aria-label="Search descriptions" autocomplete="off">
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      <div class="count" id="count"></div>
      <ul class="list" id="list"></ul>
    </div>
  </aside>

  <main class="main">
    <div class="viewer" id="viewer-wrap">
      <div id="pdf-viewer" style="display:none; flex-direction:column; height:100%; width:100%;">
        <!-- Top bar matching Archive.org style -->
        <div style="background:#1a1a1a; border-bottom:1px solid #333; padding:12px 20px; display:flex; align-items:center; gap:15px;">
          <span style="color:#999; font-size:14px;">📚</span>
          <span id="pdf-title" style="color:#e8e8e8; font-size:14px; flex:1;"></span>
        </div>

        <!-- Viewer container -->
        <div id="pdf-container" style="flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <div id="pdf-loading"></div>
          <!-- Pages will be rendered here -->
        </div>

        <!-- Bottom bar matching Archive.org - playback style controls -->
        <div id="pdf-controls" style="background:#1a1a1a; border-top:1px solid #333; padding:12px 20px; display:flex; align-items:center; gap:12px; font-size:12px; color:#999; display:none;">
          <span id="pdf-page-info" style="color:#ccc; min-width:80px;">Page 1 of 0</span>
          <input type="range" id="pdf-slider" min="1" max="1" value="1" style="flex:1; height:4px; background:#333; border:none; border-radius:2px; cursor:pointer; accent-color:#666;">
          <button id="pdf-prev" title="Previous" style="background:none; border:none; color:#e8e8e8; cursor:pointer; font-size:16px; padding:4px 8px;">◄</button>
          <button id="pdf-next" title="Next" style="background:none; border:none; color:#e8e8e8; cursor:pointer; font-size:16px; padding:4px 8px;">►</button>
          <button id="pdf-zoom-out" title="Zoom out" style="background:none; border:none; color:#e8e8e8; cursor:pointer; font-size:16px; padding:4px 8px;">−</button>
          <span id="pdf-zoom-level" style="min-width:40px; text-align:center; color:#999;">100%</span>
          <button id="pdf-zoom-in" title="Zoom in" style="background:none; border:none; color:#e8e8e8; cursor:pointer; font-size:16px; padding:4px 8px;">+</button>
        </div>
      </div>
    </div>

    <section class="note" id="note">
      <h2 id="note-title"></h2>
      <p id="note-desc"></p>
      <div class="webmaster" id="note-webmaster"></div>
      <a id="note-link" target="_blank" rel="noopener">View on Archive.org</a>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let currentPdfDoc = null;
  let currentPage = 1;
  let currentZoom = 1;
  let pdfTitle = '';

  const isMobileView = () => window.innerWidth <= 768;

  async function renderPdfCanvas(canvasId, pageNum) {
    if (!currentPdfDoc || pageNum > currentPdfDoc.numPages || pageNum < 1) return false;

    const page = await currentPdfDoc.getPage(pageNum);
    const canvas = document.getElementById(canvasId);
    if (!canvas) return false;

    const container = canvas.parentElement;
    const availableHeight = container ? container.clientHeight - 40 : 800;
    const viewport = page.getViewport({ scale: 1 });
    const scaleToFitHeight = availableHeight / viewport.height;
    const renderScale = scaleToFitHeight * currentZoom * 1.5;

    const scaledViewport = page.getViewport({ scale: renderScale });
    const ctx = canvas.getContext('2d');
    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;

    const renderContext = { canvasContext: ctx, viewport: scaledViewport };
    await page.render(renderContext);
    return true;
  }

  async function renderMobileVerticalScroll() {
    if (!currentPdfDoc) return;

    const container = document.getElementById('pdf-container');
    container.style.overflow = 'auto';
    container.innerHTML = '';

    const viewport = (await currentPdfDoc.getPage(1)).getViewport({ scale: 1 });
    const availableWidth = container.clientWidth - 40;
    const scaleToFitWidth = availableWidth / viewport.width;
    const renderScale = scaleToFitWidth * currentZoom * 1.5;

    // Render all pages vertically
    for (let p = 1; p <= currentPdfDoc.numPages; p++) {
      const canvas = document.createElement('canvas');
      canvas.style.maxWidth = '100%';
      canvas.style.marginBottom = '20px';
      canvas.style.border = '1px solid #333';
      container.appendChild(canvas);

      const page = await currentPdfDoc.getPage(p);
      const scaledViewport = page.getViewport({ scale: renderScale });
      const ctx = canvas.getContext('2d');
      canvas.width = scaledViewport.width;
      canvas.height = scaledViewport.height;

      const renderContext = { canvasContext: ctx, viewport: scaledViewport };
      await page.render(renderContext);
    }

    document.getElementById('pdf-page-info').textContent = `${currentPdfDoc.numPages} pages`;
    document.getElementById('pdf-zoom-level').textContent = Math.round(currentZoom * 100) + '%';
  }

  async function renderDesktopSpread() {
    if (!currentPdfDoc) return;

    const container = document.getElementById('pdf-container');
    container.style.overflow = 'hidden';
    const isMobile = isMobileView();

    // Update slider
    const slider = document.getElementById('pdf-slider');
    slider.max = currentPdfDoc.numPages;
    slider.value = currentPage;

    // Clear container
    container.innerHTML = '';

    const spreadDiv = document.createElement('div');
    spreadDiv.style.display = 'flex';
    spreadDiv.style.gap = '20px';
    spreadDiv.style.justifyContent = 'center';
    spreadDiv.style.alignItems = 'flex-start';

    // Create canvases for two-page spread
    const canvas1 = document.createElement('canvas');
    const canvas2 = document.createElement('canvas');

    canvas1.style.maxHeight = '80vh';
    canvas1.style.width = 'auto';
    canvas2.style.maxHeight = '80vh';
    canvas2.style.width = 'auto';
    canvas2.style.display = 'none';

    spreadDiv.appendChild(canvas1);
    spreadDiv.appendChild(canvas2);
    container.appendChild(spreadDiv);

    // Render pages
    await renderPdfCanvasDesktop(canvas1, currentPage);
    if (!isMobile) {
      canvas2.style.display = 'block';
      await renderPdfCanvasDesktop(canvas2, currentPage + 1);
      const endPage = Math.min(currentPage + 1, currentPdfDoc.numPages);
      document.getElementById('pdf-page-info').textContent = `Pages ${currentPage}-${endPage} of ${currentPdfDoc.numPages}`;
    } else {
      document.getElementById('pdf-page-info').textContent = `Page ${currentPage} of ${currentPdfDoc.numPages}`;
    }

    document.getElementById('pdf-zoom-level').textContent = Math.round(currentZoom * 100) + '%';
  }

  async function renderPdfCanvasDesktop(canvas, pageNum) {
    if (!currentPdfDoc || pageNum > currentPdfDoc.numPages || pageNum < 1) return;

    const page = await currentPdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });

    // Display scale to fit in viewport
    const maxHeight = Math.min(window.innerHeight * 0.67, 700);
    const scaleToFitHeight = maxHeight / viewport.height;
    const displayScale = scaleToFitHeight * currentZoom;

    // Render at 2x resolution for quality
    const renderScale = displayScale * 2;

    const displayViewport = page.getViewport({ scale: displayScale });
    const renderViewport = page.getViewport({ scale: renderScale });

    const ctx = canvas.getContext('2d');
    // High-resolution internal buffer
    canvas.width = renderViewport.width;
    canvas.height = renderViewport.height;

    // Display at fitted size
    canvas.style.width = displayViewport.width + 'px';
    canvas.style.height = displayViewport.height + 'px';

    const renderContext = { canvasContext: ctx, viewport: renderViewport };
    await page.render(renderContext);
  }

  async function renderPdfPage() {
    if (!currentPdfDoc) return;

    const isMobile = isMobileView();
    const controls = document.getElementById('pdf-controls');

    if (isMobile) {
      controls.style.display = 'none';
      await renderMobileVerticalScroll();
    } else {
      controls.style.display = 'flex';
      await renderDesktopSpread();
    }
  }

  document.getElementById('pdf-prev').addEventListener('click', () => {
    const pageSize = 2;
    if (currentPage > 1) {
      currentPage = Math.max(1, currentPage - pageSize);
      renderPdfPage();
    }
  });

  document.getElementById('pdf-next').addEventListener('click', () => {
    const pageSize = 2;
    if (currentPage < currentPdfDoc.numPages) {
      currentPage = Math.min(currentPdfDoc.numPages - 1, currentPage + pageSize);
      renderPdfPage();
    }
  });

  document.getElementById('pdf-slider').addEventListener('input', (e) => {
    currentPage = Math.max(1, parseInt(e.target.value));
    renderPdfPage();
  });

  document.getElementById('pdf-zoom-in').addEventListener('click', () => {
    currentZoom = Math.min(currentZoom + 0.2, 3);
    renderPdfPage();
  });

  document.getElementById('pdf-zoom-out').addEventListener('click', () => {
    currentZoom = Math.max(currentZoom - 0.2, 0.5);
    renderPdfPage();
  });

  async function loadPdf(url, title) {
    try {
      // Show loading indicator
      const loading = document.getElementById('pdf-loading');
      if (loading) loading.style.display = 'block';

      // Clean up previous PDF
      if (currentPdfDoc) {
        currentPdfDoc.destroy();
        currentPdfDoc = null;
      }

      const container = document.getElementById('pdf-container');
      if (container) {
        // Clear only the canvases, keep the loading indicator
        Array.from(container.children).forEach(child => {
          if (child.id !== 'pdf-loading') child.remove();
        });
      }

      currentPdfDoc = await pdfjsLib.getDocument(url).promise;
      currentPage = 1;
      currentZoom = 1;
      pdfTitle = title;

      document.getElementById('pdf-title').textContent = title;
      document.getElementById('pdf-viewer').style.display = 'flex';
      await renderPdfPage();

      // Hide loading indicator when done
      if (loading) loading.style.display = 'none';
    } catch (err) {
      console.error('PDF loading error:', err);
      document.getElementById('pdf-viewer').style.display = 'none';
      document.getElementById('viewer-wrap').innerHTML = `
        <div style="padding:20px; color:#a8a8a8; background:#111; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
          <div style="font-size:14px; margin-bottom:20px;">PDF viewer requires HTTPS or Brave browser</div>
          <a href="${url}" target="_blank" style="padding:10px 20px; background:#1f1f1f; color:#f2f2f2; text-decoration:none; border:1px solid #333; border-radius:2px; display:inline-block;">Open PDF in New Tab</a>
          <div style="font-size:12px; color:#666; margin-top:10px;">For best viewing experience</div>
        </div>
      `;
    }
  }
</script>

  const sidebarEl = document.getElementById('sidebar');
  const listEl = document.getElementById('list');

  const searchEl = document.getElementById('search');

  /* Page mode: two-page spread by default. */
  const mobileQuery = window.matchMedia('(max-width: 768px)');
  let pageMode = '2up';

  const norm = c => Array.isArray(c) ? c : (c ? [c] : []);
  const categories = [...new Set(MAGAZINES.flatMap(m => norm(m.category)))];
  let activeCategory = 'All';
  let currentId = null;
  let query = '';

  function setMenu(open) {
    sidebarEl.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.textContent = open ? 'Close' : 'Browse';
  }

  // A fresh iframe each time guarantees the viewer reloads at the right mode
  function loadViewer(m) {
    const viewerWrap = document.getElementById('viewer-wrap');
    const pdfViewer = document.getElementById('pdf-viewer');

    if (m.type === 'pdf') {
      // Show PDF viewer, remove any iframes
      if (pdfViewer) pdfViewer.style.display = 'flex';
      Array.from(viewerWrap.children).forEach(child => {
        if (child.tagName === 'IFRAME') child.remove();
      });

      const pdfUrl = m.pdfUrl;
      const title = m.title + (m.issue ? ' – ' + m.issue : '');
      loadPdf(pdfUrl, title);
    } else {
      // Hide PDF viewer for magazines
      if (pdfViewer) pdfViewer.style.display = 'none';
      Array.from(viewerWrap.children).forEach(child => {
        if (child.tagName === 'IFRAME') child.remove();
      });

      const frame = document.createElement('iframe');
      frame.title = m.title + (m.issue ? ' – ' + m.issue : '') + ' (Internet Archive)';
      frame.setAttribute('allowfullscreen', '');
      frame.src = `https://archive.org/embed/${encodeURIComponent(m.id)}?ui=embed#mode/2up`;
      viewerWrap.appendChild(frame);
    }
  }

  function select(id, pushHash = true) {
    const m = MAGAZINES.find(x => x.id === id) || MAGAZINES[0];
    if (!m) return;

    currentId = m.id;
    loadViewer(m);

    document.getElementById('note-title').textContent =
      m.title + (m.issue ? ' – ' + m.issue : '');
    document.getElementById('note-desc').textContent = m.description || '';
    const wm = document.getElementById('note-webmaster');
    wm.textContent = m.note || '';
    wm.style.display = m.note ? '' : 'none';
    document.getElementById('note-link').href =
      'https://archive.org/details/' + encodeURIComponent(m.id);

    listEl.querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-current', String(b.dataset.id === m.id)));

    if (pushHash) history.replaceState(null, '', '#' + encodeURIComponent(m.id));
  }

  function renderFilters() {
    filtersEl.innerHTML = '';
    ['All', ...categories].forEach(cat => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = cat;
      b.setAttribute('aria-pressed', String(cat === activeCategory));
      b.addEventListener('click', () => {
        activeCategory = cat;
        renderFilters();
        renderList();
      });
      filtersEl.appendChild(b);
    });
  }

  function renderList() {
    listEl.innerHTML = '';
    // Every typed word must appear in the description (case-insensitive)
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    const items = MAGAZINES.filter(m => {
      const inCategory = activeCategory === 'All' || norm(m.category).includes(activeCategory);
      const desc = (m.description || '').toLowerCase();
      return inCategory && terms.every(t => desc.includes(t));
    });

    countEl.textContent = items.length + (items.length === 1 ? ' item' : ' items');

    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No magazines match.';
      listEl.appendChild(li);
      return;
    }

    items.forEach(m => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.dataset.id = m.id;
      btn.innerHTML = '<span class="name"></span><span class="sub"></span>';
      // Line 1: tagline. Line 2: magazine title.
      btn.querySelector('.name').textContent = m.tagline || m.title;
      btn.querySelector('.sub').textContent = m.tagline ? m.title : '';
      btn.setAttribute('aria-current', String(m.id === currentId));
      btn.addEventListener('click', () => select(m.id));
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  searchEl.addEventListener('input', () => {
    query = searchEl.value;
    renderList();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  renderFilters();
  renderList();

  // Open from a shared link (#IDENTIFIER), featured item, or pick a random magazine
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) {
    select(hash, false);
  } else {
    const featured = MAGAZINES.find(m => m.featured);
    if (featured) {
      select(featured.id, false);
    } else {
      const randomId = MAGAZINES[Math.floor(Math.random() * MAGAZINES.length)].id;
      select(randomId, false);
    }
  }
</script>

</body>
</html>
